[project]
name = "gateway"
version = "0.1.0"
description = "Unified API reliability, security, and cost-governance gateway"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",      # async HTTP client — used by adapters to actually call providers
    "pydantic>=2.6.0",    # event schema validation + serialization for the ledger
    "tzdata>=2024.1",     # zoneinfo needs a tz database; slim images and Windows ship none
                          # (Quota Engine calendar-day windows, Gemini's midnight-Pacific reset)
]

[project.optional-dependencies]
server = [
    # Fixes audit F-12: server.py imports fastapi but these were undeclared,
    # so a fresh `pip install -e .` produced ModuleNotFoundError on import
    # gateway.server. Install with: pip install -e ".[server]"
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.16.0",       # `ruff check src/ tests/ examples/` is the project's lint gate
    "gateway[server]",    # tests/test_server_endpoints.py needs fastapi TestClient
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"gateway.ledger.migrations" = ["*.sql"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
