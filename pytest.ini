[pytest]
asyncio_mode = auto
# The broken `libtmux` pytest plugin (third-party, not a project dependency) crashes
# collection with "Marks cannot be applied to fixtures" in some environments. Blocking
# it here makes a plain `python -m pytest tests/` work everywhere without the
# `-p no:libtmux` workaround.
addopts = -p no:libtmux
